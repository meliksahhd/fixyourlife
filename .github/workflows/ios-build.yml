name: ios-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: xcodebuild build -project FixYourLife.xcodeproj -scheme FixYourLife -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
