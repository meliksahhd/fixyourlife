workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: fyl_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.meliksahhd.fixyourlife
      vars:
        APP_STORE_APPLE_ID: 6833892471
      xcode: latest
    triggering:   # yalnızca build-* etiketleri: ücretsiz 500 dk/ay kotası korunur
      events:
        - tag
      tag_patterns:
        - pattern: 'build-*'
          include: true
    scripts:
      - name: Xcode projesini üret
        script: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen && xcodegen generate
      - name: İmzalama profilleri
        script: xcode-project use-profiles
      - name: Derleme numarası
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: IPA
        script: xcode-project build-ipa --project FixYourLife.xcodeproj --scheme FixYourLife
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration   # iç test grubuna otomatik dağıtılır; dış beta incelemesi gerekmez
